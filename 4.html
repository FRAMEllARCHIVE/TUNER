<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guitar Tuner</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 600px;
    }

    .note {
      font-size: 5rem;
      margin: 1rem 0;
    }

    .frequency {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .indicator {
      width: 100%;
      height: 10px;
      background: #333;
      position: relative;
      margin: 1rem 0;
    }

    .needle {
      position: absolute;
      top: -5px;
      width: 2px;
      height: 20px;
      background: #1db954;
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.1s ease;
    }

    .controls {
      margin-top: 2rem;
    }

    button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tuner-status {
      margin-top: 1rem;
      font-size: 1rem;
      color: #888;
    }

    .guitar-strings {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 2rem;
    }

    .string {
      text-align: center;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
    }

    .string:hover {
      background: #222;
    }

    .string.active {
      background: #1db954;
      color: #000;
    }
  </style>
</head>
<body>
  <main>
    <section aria-live="polite">
      <div class="note" id="note">--</div>
      <div class="frequency" id="frequency">0.00 Hz</div>
      <div class="indicator">
        <div class="needle" id="needle"></div>
      </div>
      <div class="tuner-status" id="tuner-status">Ready</div>
    </section>

    <section class="guitar-strings" aria-label="Guitar Strings">
      <div class="string" data-note="E2" data-freq="82.41">E2</div>
      <div class="string" data-note="A2" data-freq="110.00">A2</div>
      <div class="string" data-note="D3" data-freq="146.83">D3</div>
      <div class="string" data-note="G3" data-freq="196.00">G3</div>
      <div class="string" data-note="B3" data-freq="246.94">B3</div>
      <div class="string" data-note="E4" data-freq="329.63">E4</div>
    </section>

    <section class="controls">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
    </section>
  </main>

  <script>
    (() => {
      const noteEl = document.getElementById('note');
      const freqEl = document.getElementById('frequency');
      const needleEl = document.getElementById('needle');
      const startBtn = document.getElementById('start');
      const stopBtn = document.getElementById('stop');
      const tunerStatusEl = document.getElementById('tuner-status');
      const stringEls = document.querySelectorAll('.string');

      const A4 = 440;
      const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      let audioContext, analyser, microphone, bufferLength, dataArray;
      let rafId, isRunning = false;
      let targetNote = null, targetFreq = null;

      function noteFromFrequency(freq) {
        const noteNum = 12 * (Math.log(freq / A4) / Math.log(2));
        return Math.round(noteNum) + 69;
      }

      function frequencyFromNoteNumber(note) {
        return A4 * Math.pow(2, (note - 69) / 12);
      }

      function centsOffFromPitch(freq, note) {
        const expectedFrequency = frequencyFromNoteNumber(note);
        const ratio = freq / expectedFrequency;
        return Math.floor(1200 * Math.log2(ratio));
      }

      function autoCorrelate(buffer, sampleRate) {
        const SIZE = buffer.length;
        const MAX_SAMPLES = Math.floor(SIZE / 2);
        let bestOffset = -1, bestCorrelation = 0, rms = 0;

        for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1;

        const correlations = new Float32Array(MAX_SAMPLES);

        for (let offset = 0; offset < MAX_SAMPLES; offset++) {
          let correlation = 0;
          for (let i = 0; i < MAX_SAMPLES; i++) {
            correlation += Math.abs(buffer[i] - buffer[i + offset]);
          }
          correlations[offset] = 1 - (correlation / MAX_SAMPLES);
        }

        for (let i = 1; i < MAX_SAMPLES - 1; i++) {
          if (correlations[i] > correlations[i - 1] &&
              correlations[i] > correlations[i + 1] &&
              correlations[i] > 0.9 && i > 8) {
            bestOffset = i;
            bestCorrelation = correlations[i];
            break;
          }
        }

        if (bestOffset !== -1) {
          const left = correlations[bestOffset - 1];
          const right = correlations[bestOffset + 1];
          const shift = (right - left) / (2 * (2 * bestCorrelation - left - right));
          return sampleRate / (bestOffset + shift);
        }

        return -1;
      }

      function updatePitch() {
        analyser.getFloatTimeDomainData(dataArray);
        const freq = autoCorrelate(dataArray, audioContext.sampleRate);

        if (freq > 0 && freq < 2000) {
          const note = noteFromFrequency(freq);
          const noteName = noteStrings[note % 12];
          const octave = Math.floor(note / 12) - 1;
          const cents = centsOffFromPitch(freq, note);

          noteEl.textContent = `${noteName}${octave}`;
          freqEl.textContent = `${freq.toFixed(2)} Hz`;
          needleEl.style.transform = `translateX(${cents / 2}px)`;

          if (targetNote) {
            const [targetNoteName, targetOctave] = [targetNote.slice(0, -1), targetNote.slice(-1)];
            if (noteName === targetNoteName && String(octave) === targetOctave) {
              if (Math.abs(cents) < 10) {
                tunerStatusEl.textContent = "Perfect!";
                tunerStatusEl.style.color = "#1db954";
              } else if (Math.abs(cents) < 30) {
                tunerStatusEl.textContent = "Almost there!";
                tunerStatusEl.style.color = "#ffa500";
              } else {
                tunerStatusEl.textContent = cents > 0 ? "Too high" : "Too low";
                tunerStatusEl.style.color = "#ff4500";
              }
            } else {
              tunerStatusEl.textContent = `Play the ${targetNote} string`;
              tunerStatusEl.style.color = "#888";
            }
          } else {
            tunerStatusEl.textContent = Math.abs(cents) < 10 ? "In tune!" : (cents > 0 ? "Too high" : "Too low");
            tunerStatusEl.style.color = Math.abs(cents) < 10 ? "#1db954" : "#ff4500";
          }

        } else {
          noteEl.textContent = "--";
          freqEl.textContent = "0.00 Hz";
          needleEl.style.transform = "translateX(0)";
          tunerStatusEl.textContent = "No pitch detected";
          tunerStatusEl.style.color = "#888";
        }

        if (isRunning) rafId = requestAnimationFrame(updatePitch);
      }

      async function startTuner() {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          microphone = audioContext.createMediaStreamSource(stream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          bufferLength = analyser.fftSize;
          dataArray = new Float32Array(bufferLength);
          microphone.connect(analyser);

          isRunning = true;
          updatePitch();

          startBtn.disabled = true;
          stopBtn.disabled = false;
          tunerStatusEl.textContent = "Listening...";
        } catch (err) {
          tunerStatusEl.textContent = "Microphone access denied.";
          tunerStatusEl.style.color = "#ff4500";
          console.error(err);
        }
      }

      function stopTuner() {
        isRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        if (microphone) microphone.disconnect();
        if (analyser) analyser.disconnect();
        if (audioContext && audioContext.state !== "closed") {
          audioContext.close().catch(console.error);
        }

        startBtn.disabled = false;
        stopBtn.disabled = true;
        tunerStatusEl.textContent = "Ready";
        tunerStatusEl.style.color = "#888";
        noteEl.textContent = "--";
        freqEl.textContent = "0.00 Hz";
        needleEl.style.transform = "translateX(0)";
      }

      function selectString(event) {
        stringEls.forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        targetNote = event.currentTarget.dataset.note;
        targetFreq = parseFloat(event.currentTarget.dataset.freq);
        tunerStatusEl.textContent = `Target: ${targetNote} (${targetFreq} Hz)`;
      }

      startBtn.addEventListener('click', startTuner);
      stopBtn.addEventListener('click', stopTuner);
      stringEls.forEach(el => el.addEventListener('click', selectString));
      window.addEventListener('beforeunload', stopTuner);
    })();
  </script>
</body>
</html>
